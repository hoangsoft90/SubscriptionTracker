name: Build Debug APK

# Debug APK cho test nhanh trên máy thật — KHÔNG cần keystore, không ký
# release. Chạy trên push main + manual trigger. (Release AAB ký thật nằm ở
# workflow riêng `build-release-aab.yml` — cần keystore từ GitHub Secrets.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # TEST_ADS=true → Google sample ad unit IDs (always fill on ANY device,
      # no test-device registration needed). Real ad unit IDs return NO_FILL on
      # debug builds of an unpublished app (AdMob anti-fraud), and this dev
      # phone's advertising ID keeps rotating so test-device registration is
      # unreliable. Release AAB (build-release-aab.yml) has NO TEST_ADS flag →
      # keeps the REAL ad unit IDs for the store.
      - name: Build debug APK (Gradle)
        run: flutter build apk --debug --dart-define=TEST_ADS=true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtrack-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
